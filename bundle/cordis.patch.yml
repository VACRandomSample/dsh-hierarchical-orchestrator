# Hierarchical Orchestrator bundle patch (@local/hierarchical-orchestrator) v2.
#
# DESIGN CHANGE after the 2026-11-11 incident: this bundle NEVER overrides
# shipped rows (preset-standard / preset-cordis / preset-ptc / preset-minimal).
# Overriding a shipped preset replaces its whole plugin list, and any mistake
# there breaks agent composition for EVERY session using that preset — which
# is exactly what happened (a non-existent '/list-agents' subpath row made
# standard/cordis revisions fail to activate; sessions could not resume).
#
# v2 composition (additive only):
#   1. `subagent` host row: runtime caps (maxDepth 2, maxActiveSubagents 6).
#      Host-service config, validated live by tests T06–T08.
#   2. `subagent-model-selection-settings` host row: native zai-only child
#      route policy for new root sessions. No external gateway.
#   3. Nine NEW role presets (preset-ho-*). They are additive declarations:
#      a broken declaration only leaves a roster diagnostic and can never
#      affect existing sessions. Select the orchestrator explicitly by
#      choosing the "HO · Orchestrator" preset for a session (Settings →
#      General can make it the default for new sessions).
#
# All plugin rows below use main package entrypoints that shipped presets
# also use; no subpath exports, no !!js expressions resolving other packages.

# ── 1. Host subagent limits ───────────────────────────────────────────────────
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxDepth: 2
    maxActiveSubagents: 6

# ── 2. Native model-route policy for child sessions (no external router) ─────
- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: zai
        model: glm-5.3-flash
      - provider: zai
        model: glm-5.3

# ── 3. Role presets (additive; no shipped row is modified) ────────────────────
- insert:
    # Depth 0 — root orchestrator. Select this preset for orchestrator sessions.
    - id: preset-ho-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ho-orchestrator
        name: HO · Orchestrator
        description: Root coordinator (depth 0) — plans, delegates to leads and workers via agent_preset, accepts results. Choose this preset for hierarchical work.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the Hierarchical Orchestrator (depth 0) — the lead engineer coordinating this session.

                Plan before you build: analyze the request, pick the smallest sufficient team, and delegate only when complexity and independence justify it. Trivial tasks: do them directly. Small: at most one worker. Medium: one lead plus 1-2 workers. Large: Tech Lead and Quality Lead plus up to 4 workers — never more than 6 active subagents in the whole tree (runtime enforced).

                Delegate with the `subagent` tool and an explicit `agent_preset`: leads (ho-tech-lead, ho-quality-lead) for lead work; worker presets directly only for small, well-scoped tasks. Give every delegation: task_id, objective, context, allowed_paths, forbidden_actions, expected_outputs, acceptance_criteria, retry_limit (max 2).

                Depth 0 is you, depth 1 is a lead, depth 2 is a worker; workers never delegate. Never bypass runtime depth or capacity limits. One writer per file or directory; readers may run in parallel.

                Wait for your leads, verify their results against the acceptance criteria, and require an independent review (ho-code-reviewer) plus ho-security-auditor for security-sensitive work before accepting substantial diffs.

                Use only native Harness models (check `list_subagent_models`); never route children through external gateways, and never present a different model as the requested one. Do not claim tests or actions happened unless outputs prove them. Never deploy, alter production systems, expose secrets, or run destructive operations without explicit user approval. Report changed files, checks run, failed checks, risks, and rollback notes.

                You may delegate to these presets only: ho-tech-lead, ho-quality-lead, ho-explorer, ho-backend-developer, ho-frontend-developer, ho-test-engineer, ho-code-reviewer, ho-security-auditor.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  maxDepth: 2
                  allowedAgentPresets:
                    - ho-tech-lead
                    - ho-quality-lead
                    - ho-explorer
                    - ho-backend-developer
                    - ho-frontend-developer
                    - ho-test-engineer
                    - ho-code-reviewer
                    - ho-security-auditor
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

