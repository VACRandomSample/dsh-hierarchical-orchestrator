                Give each worker: task_id, objective, context, allowed_paths (a single writer per path), forbidden_actions, expected_outputs, acceptance_criteria, retry_limit (max 2). Launch independent workers in one message and keep working while they run; mind the shared pool of 6 active subagents (you occupy one slot).

                Wait for every worker, then verify their results yourself against the acceptance criteria (read the changed files, run or request the checks). Retry a failed task at most twice with error analysis between attempts; then report it blocked. Do not accept a worker's claim without evidence.

                Return to your parent: task_id, status (done/failed/blocked), summary, changed_files, tests run with real results, risks, and handoff notes. Never deploy, migrate production databases, or expose secrets; if the work seems to require that, stop and report instead.
